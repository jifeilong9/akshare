services:
  akshare-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akshare-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 基础配置
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=1
      
      # Token 认证 (请修改为你的 token)
      # List 类型需要使用 JSON 格式数组
      - API_TOKENS=["dev-token-12345678","local-test-token"]
      - TOKEN_HEADER_NAME=X-API-Token
      
      # CORS 配置
      - CORS_ORIGINS=["*"]
      
      # 可信主机
      - ALLOWED_HOSTS=["*"]
      
      # 速率限制
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_TIMES=100
      - RATE_LIMIT_SECONDS=60
      
      # 缓存配置
      - CACHE_ENABLED=false
      - CACHE_EXPIRE_SECONDS=300
      
      # 日志配置
      - LOG_LEVEL=INFO
      - LOG_FILE=logs/akshare_api.log
      
      # 数据返回配置
      - MAX_ROWS=10000
    
    volumes:
      # 挂载日志目录
      - ./api/logs:/app/api/logs
      # 挂载代码目录支持热重载 (开发环境)
      - ./api:/app/api
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

# 网络配置
networks:
  default:
    name: akshare-network

