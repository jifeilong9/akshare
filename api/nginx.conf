# Nginx 配置示例 - AKShare API 服务
# 适用于生产环境部署

upstream akshare_api {
    # 负载均衡配置
    # 如果使用多个 worker,可以添加多个 server
    server 127.0.0.1:8000;
    # server 127.0.0.1:8001;
    # server 127.0.0.1:8002;
}

# HTTP 服务器配置
server {
    listen 80;
    server_name api.yourdomain.com;  # 修改为你的域名

    # 访问日志
    access_log /var/log/nginx/akshare_api_access.log;
    error_log /var/log/nginx/akshare_api_error.log;

    # 客户端最大请求体大小
    client_max_body_size 10M;

    # API 接口代理
    location / {
        proxy_pass http://akshare_api;
        proxy_http_version 1.1;
        
        # 代理请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # 健康检查端点 (不记录日志)
    location /health {
        proxy_pass http://akshare_api;
        access_log off;
    }

    # 静态文件缓存 (如果有的话)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        proxy_pass http://akshare_api;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# HTTPS 服务器配置 (推荐生产环境使用)
# 需要先配置 SSL 证书
server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;  # 修改为你的域名

    # SSL 证书配置 (修改为你的证书路径)
    ssl_certificate /path/to/your/fullchain.pem;
    ssl_certificate_key /path/to/your/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (可选,增强安全性)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 访问日志
    access_log /var/log/nginx/akshare_api_ssl_access.log;
    error_log /var/log/nginx/akshare_api_ssl_error.log;

    # 客户端最大请求体大小
    client_max_body_size 10M;

    # API 接口代理
    location / {
        proxy_pass http://akshare_api;
        proxy_http_version 1.1;
        
        # 代理请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # 健康检查端点
    location /health {
        proxy_pass http://akshare_api;
        access_log off;
    }

    # 静态文件缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        proxy_pass http://akshare_api;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

